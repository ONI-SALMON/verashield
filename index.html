<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeraShield</title>
<meta name="description" content="VeraShield helps teens aged 13 to 17 respond to image-based abuse: whether AI-generated or real. Free tool with crisis resources in Mexico, India, and more.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main" id="skip-link"></a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="./" aria-label="VeraShield">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5 4.5 5.5v5.8c0 4.5 3.1 8.2 7.5 10.2 4.4-2 7.5-5.7 7.5-10.2V5.5L12 2.5Z" fill="currentColor"/>
        <path d="m8.8 12.2 2.3 2.3 4.2-4.6" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark">VeraShield</span>
    </a>
    <div class="header-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="es" lang="es" aria-pressed="true">Español</button>
        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false">English</button>
        <button type="button" class="lang-btn" data-lang="hi" lang="hi" aria-pressed="false">हिन्दी</button>
      </div>
      <button type="button" class="quick-exit" id="quick-exit"></button>
    </div>
  </div>
</header>

<div class="flow-bar" id="flow-bar">
  <div class="flow-bar-inner">
    <p class="flow-bar-step" id="flow-bar-step" aria-live="polite"></p>
    <label class="flow-bar-country"><span id="country-label"></span>
      <select id="country-select"></select></label>
    <button type="button" class="flow-bar-plan" id="plan-btn"></button>
  </div>
</div>

<main class="page" id="main">
  <div id="flow-root">
    <section class="step" id="step-home" hidden></section>
    <section class="step" id="step-respira" hidden></section>
    <section class="step" id="step-que-paso" hidden></section>

    <section class="step" id="step-analisis" hidden>
      <div class="step-head" id="analysis-head"></div>
      <section id="upload-screen" class="screen">
    <div class="panel">
      <div class="mode-toggle" id="mode-toggle" role="group">
        <button type="button" class="mode-btn active" data-mode="photo" aria-pressed="true" data-vi18n="modePhoto"></button>
        <button type="button" class="mode-btn" data-mode="video" aria-pressed="false" data-vi18n="modeVideo"></button>
      </div>

      <div class="input-block" id="photo-input-block">
        <p class="step-label"><span class="step-num">1</span><span data-i18n="stepUpload"></span></p>
        <label class="upload-zone" id="upload-zone" for="file-input" tabindex="0">
          <span class="upload-preview" id="upload-preview" hidden><img id="upload-preview-img" alt=""></span>
          <svg class="upload-icon" id="upload-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <span class="upload-text"></span>
          <span class="upload-hint" id="upload-hint" data-i18n="uploadHint"></span>
        </label>
        <input type="file" id="file-input" accept="image/*" hidden>
        <div id="privacy-panel-upload"></div>
      </div>

      <div class="input-block" id="video-input-block" hidden>
        <p class="step-label"><span class="step-num">1</span><span data-vi18n="stepVideo"></span></p>
        <label class="upload-zone" id="video-upload-zone" for="video-input" tabindex="0">
          <svg class="upload-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/>
          </svg>
          <span class="video-upload-text" id="video-upload-text" data-vi18n="videoPrompt"></span>
          <span class="upload-hint" id="video-upload-hint" data-vi18n="videoLimit"></span>
        </label>
        <input type="file" id="video-input" accept="video/mp4,video/quicktime,video/webm,video/x-msvideo,.mp4,.mov,.webm,.avi" hidden>

        <div class="or-divider" role="separator"><span data-vi18n="or"></span></div>

        <label class="url-field"><span class="visually-hidden" data-vi18n="urlLabel"></span>
          <input type="url" id="video-url" inputmode="url" autocomplete="off" spellcheck="false" maxlength="2048" data-vi18n-ph="urlPlaceholder">
        </label>
        <p class="url-note" id="video-url-note" data-vi18n="urlNote"></p>
      </div>

      <div class="video-soon" id="video-soon" hidden>
        <svg class="video-soon-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        <h2 class="video-soon-title" id="video-soon-title"></h2>
        <p class="video-soon-body" id="video-soon-body"></p>
      </div>

      <p class="step-label" id="step-analyze-label"><span class="step-num">2</span><span data-i18n="stepAnalyze"></span></p>
      <button type="button" id="analyze-btn" disabled></button>
      <p class="analyze-hint" id="analyze-hint" data-i18n="analyzeHint"></p>
      <p class="form-error" id="form-error" role="alert" hidden></p>

      <section class="alt-route" id="alternative-route" aria-labelledby="alt-route-title" hidden></section>

    </div>
      </section>
    <section id="result-screen" class="screen" aria-labelledby="result-heading" hidden>
      <div class="result-summary">
        <h3 class="section-heading" id="result-heading" tabindex="-1"></h3>
        <div class="score-display" id="score-display">
          <div class="score-value"><span class="score-number" id="score-number">0</span><span class="score-unit">%</span></div>
          <div class="score-body">
            <span class="score-caption" id="score-caption"></span>
            <span class="score-label" id="score-label"></span>
            <div class="score-meter" aria-hidden="true"><i id="score-meter-fill"></i></div>
          </div>
        </div>
        <p class="score-explanation" id="score-explanation"></p>
        <p class="score-generator" id="score-generator" hidden></p>
        <p class="resource-text" id="analysis-low-note" hidden></p>
        <p class="resource-text accuracy-result-note" id="analysis-accuracy-note"></p>
        <button type="button" id="reset-btn" class="secondary-btn"></button>
      </div>
    </section>
      <div class="step-actions" id="analysis-actions"></div>
    </section>

    <section class="step" id="step-contarlo" hidden></section>
    <section class="step" id="step-frenar" hidden></section>

    <section class="step" id="step-adulto" hidden>
      <div id="adult-render"></div>
      <div class="letter-host" id="adult-letter-host">
        <div id="case-fields">
        <div class="sl-field state-field" id="state-field" hidden>
          <label for="state-select" id="state-label"></label>
          <select id="state-select" aria-describedby="state-error" aria-required="true" required>
            <option value="" data-sl="statePh"></option>
            <option value="unknown" data-sl="stateUnknown"></option>
            <option value="Aguascalientes">Aguascalientes</option>
            <option value="Baja California">Baja California</option>
            <option value="Baja California Sur">Baja California Sur</option>
            <option value="Campeche">Campeche</option>
            <option value="Chiapas">Chiapas</option>
            <option value="Chihuahua">Chihuahua</option>
            <option value="Ciudad de México">Ciudad de México</option>
            <option value="Coahuila">Coahuila</option>
            <option value="Colima">Colima</option>
            <option value="Durango">Durango</option>
            <option value="Estado de México">Estado de México</option>
            <option value="Guanajuato">Guanajuato</option>
            <option value="Guerrero">Guerrero</option>
            <option value="Hidalgo">Hidalgo</option>
            <option value="Jalisco">Jalisco</option>
            <option value="Michoacán">Michoacán</option>
            <option value="Morelos">Morelos</option>
            <option value="Nayarit">Nayarit</option>
            <option value="Nuevo León">Nuevo León</option>
            <option value="Oaxaca">Oaxaca</option>
            <option value="Puebla">Puebla</option>
            <option value="Querétaro">Querétaro</option>
            <option value="Quintana Roo">Quintana Roo</option>
            <option value="San Luis Potosí">San Luis Potosí</option>
            <option value="Sinaloa">Sinaloa</option>
            <option value="Sonora">Sonora</option>
            <option value="Tabasco">Tabasco</option>
            <option value="Tamaulipas">Tamaulipas</option>
            <option value="Tlaxcala">Tlaxcala</option>
            <option value="Veracruz">Veracruz</option>
            <option value="Yucatán">Yucatán</option>
            <option value="Zacatecas">Zacatecas</option>
          </select>
          <p class="form-error" id="state-error" role="alert" hidden></p>
        </div>
        </div>
        <section class="school-letter" id="school-letter" aria-labelledby="school-letter-title">
          <details id="school-letter-details">
            <summary id="school-letter-title" data-sl="title"></summary>
            <p class="school-letter-intro" data-sl="intro"></p>
            <form class="school-letter-form" id="school-letter-form" autocomplete="off" novalidate>
              <label class="sl-field"><span data-sl="student"></span>
                <input type="text" id="sl-student" maxlength="100" data-sl-ph="studentPh"></label>
              <label class="sl-field"><span data-sl="grade"></span>
                <input type="text" id="sl-grade" maxlength="40" data-sl-ph="gradePh"></label>
              <label class="sl-field"><span data-sl="school"></span>
                <input type="text" id="sl-school" maxlength="120" data-sl-ph="schoolPh"></label>
              <label class="sl-field"><span data-sl="date"></span>
                <input type="date" id="sl-date"></label>
              <label class="sl-field"><span data-sl="desc"></span>
                <textarea id="sl-description" maxlength="300" rows="4" data-sl-ph="descPh"></textarea>
                <small class="sl-counter" id="sl-counter">0 / 300</small>
                <small class="sl-warn" data-sl="descWarn"></small></label>
              <label class="sl-field"><span data-sl="guardian"></span>
                <input type="text" id="sl-guardian" maxlength="100" data-sl-ph="guardianPh"></label>
              <label class="sl-field" id="sl-level-field" data-level-field><span data-sl="level"></span>
                <select id="sl-level">
                  <option value="" data-sl="levelPh"></option>
                  <option value="basica" data-sl="levelBasica"></option>
                  <option value="mediaFederal" data-sl="levelMediaFederal"></option>
                  <option value="local" data-sl="levelLocal"></option>
                  <option value="unknown" data-sl="levelUnknown"></option>
                </select></label>
              <p class="form-error" id="sl-error" role="alert" hidden></p>
              <div class="sl-actions">
                <button type="submit" class="sl-generate-btn" id="sl-generate" data-sl="generate"></button>
                <button type="button" class="sl-clear-btn" id="sl-clear" data-sl="clear"></button>
              </div>
            </form>
          </details>
        </section>
      </div>
      <div class="pdf-host" id="adult-pdf-host">
        <h3 id="adult-pdf-title"></h3>
        <p class="resource-text" id="adult-pdf-lead"></p>
        <button type="button" id="download-pdf-btn" class="secondary-btn"></button>
      </div>
      <div id="adult-nav"></div>
    </section>

    <section class="step" id="step-cuidarte" hidden></section>
  </div>
</main>

<div class="privacy-modal" id="plan-modal" hidden></div>
<div class="print-sheet" id="print-sheet" aria-hidden="true"></div>

<div class="privacy-modal" id="privacy-modal" hidden>
  <div class="privacy-modal-card" role="dialog" aria-modal="true" aria-labelledby="privacy-modal-title">
    <button type="button" class="privacy-modal-close" id="privacy-modal-close">&times;</button>
    <h2 id="privacy-modal-title"></h2>
    <div id="privacy-modal-body"></div>
  </div>
</div>

<!-- Blocking content guard: asked before any file is sent to an external API. No close button, no Escape, no click-outside. -->
<div class="privacy-modal" id="content-guard-modal" hidden>
  <div class="privacy-modal-card" role="alertdialog" aria-modal="true" aria-labelledby="content-guard-question">
    <h2 id="content-guard-question"></h2>
    <div class="content-guard-actions">
      <button type="button" class="secondary-btn" id="content-guard-no"></button>
      <button type="button" class="primary-btn" id="content-guard-yes"></button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script type="module" src="app.js"></script>
</body>
</html>
