<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeraShield</title>
<meta name="description" content="VeraShield helps teens aged 13–17 respond to image-based abuse — whether AI-generated or real. Free tool with crisis resources in Mexico, India, and more.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <section id="upload-screen">
    <div class="lang-toggle">
      <button type="button" class="lang-btn active" data-lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="hi">हि</button>
    </div>

    <h1 class="wordmark">VeraShield</h1>
    <h2 class="hero-title"></h2>
    <p class="hero-subtitle"></p>

    <label class="upload-zone" id="upload-zone" for="file-input" tabindex="0">
      <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <p class="upload-text"></p>
    </label>
    <input type="file" id="file-input" accept="image/*" hidden>

    <button type="button" id="analyze-btn" disabled></button>

    <p class="form-error" id="form-error" role="alert" hidden></p>

    <p class="privacy-note"></p>

    <button type="button" id="direct-crisis-btn" class="link-btn"></button>
  </section>

  <section id="result-screen" hidden>
    <div class="lang-toggle">
      <button type="button" class="lang-btn active" data-lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="hi">हि</button>
    </div>

    <div class="score-display" id="score-display">
      <span class="score-number" id="score-number">0</span>
      <span class="score-label" id="score-label"></span>
    </div>

    <p class="score-explanation" id="score-explanation"></p>

    <p class="no-detection-note" id="no-detection-note" hidden>
      <span id="no-detection-text"></span>
      <button type="button" id="no-detection-link" class="link-btn"></button>
    </p>

    <div class="country-selector" id="country-selector" hidden>
      <button type="button" class="country-btn active" data-country="mx">México</button>
      <button type="button" class="country-btn" data-country="in">India</button>
      <button type="button" class="country-btn" data-country="us">United States</button>
    </div>

    <div class="crisis-pathway" id="crisis-pathway" hidden>
      <h2 class="direct-crisis-heading" id="direct-crisis-heading" hidden></h2>
      <div class="victim-toggle" id="victim-toggle">
        <button type="button" class="victim-toggle-btn" data-mode="me"></button>
        <button type="button" class="victim-toggle-btn" data-mode="other"></button>
      </div>
      <p class="crisis-intro" id="crisis-intro"></p>
      <a class="share-btn whatsapp-btn" id="whatsapp-btn" target="_blank" rel="noopener"></a>
      <h3 class="crisis-title"></h3>
      <ol class="crisis-steps" id="crisis-steps"></ol>
      <div class="ngo-card" id="ngo-card"></div>
      <p class="legal-note" id="legal-note"></p>
      <a class="takedown-btn" id="takedown-btn" href="https://takeitdown.ncmec.org" target="_blank" rel="noopener"></a>
    </div>

    <p class="privacy-note"></p>

    <button type="button" id="reset-btn"></button>
    <button type="button" id="back-to-upload-btn" class="link-btn" hidden></button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
